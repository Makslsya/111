<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Screen Audio Button</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    font-family: Arial, sans-serif;
}

.button {
    width: 80vw;
    height: 80vw; /* Квадратная кнопка */
    max-width: 400px;
    max-height: 400px;
    background: radial-gradient(circle at center, #ff6a00, #ee0979);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-size: 2rem;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    transition: transform 0.2s, box-shadow 0.2s;
    user-select: none;
}

.button:active {
    transform: scale(0.95);
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

@media (max-width: 400px) {
    .button {
        width: 70vw;
        height: 70vw;
        font-size: 1.5rem;
    }
}
</style>
</head>
<body>

<div class="button" id="playButton">Нажми для звука</div>

<audio id="audio" src="sound1.wav"></audio>

<script>
const button = document.getElementById('playButton');
const audio = document.getElementById('audio');

button.addEventListener('click', () => {
    audio.currentTime = 0; // чтобы можно было нажимать многократно
    audio.play();
    button.innerText = "Играет..."; // меняем текст при воспроизведении
    setTimeout(() => {
        button.innerText = "Нажми для звука";
    }, audio.duration * 1000);
});
</script>

</body>
</html>

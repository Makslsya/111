<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Player</title>

<style>
/* Сброс и базовые стили */
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
}

/* Плеер на весь экран */
.player {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    width: 90%;
    max-width: 400px;
}

/* Заголовок */
h1 {
    color: #ffffff;
    font-size: 1.8rem;
    font-weight: 600;
    margin-bottom: 40px;
    text-align: center;
    letter-spacing: 1.5px;
}

/* Аудио плеер */
audio {
    width: 100%;
    outline: none;
    border-radius: 12px;
    background: #222;
    padding: 10px;
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.3);
}

/* Адаптивность для маленьких экранов */
@media (max-width: 400px) {
    h1 {
        font-size: 1.5rem;
        margin-bottom: 30px;
    }
    .player {
        padding: 30px 20px;
    }
}
</style>
</head>

<body>

<div class="player">
    <h1>Audio Playback</h1>
    <audio controls>
        <source src="sound1.wav" type="audio/mpeg">
        Ваш браузер не поддерживает аудио.
    </audio>
</div>

</body>
</html>
